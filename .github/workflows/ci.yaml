name: CI

on:
  push:
    branches:
      - main
      - release-*
  pull_request: {}
  workflow_dispatch:
    inputs:
      version:
        description: Package version (e.g. v0.1.0)
        required: false

env:
  NODE_VERSION: "24"

  # This CI job will automatically push new builds to xpkg.upbound.io if the
  # XPKG_ACCESS_ID and XPKG_TOKEN secrets are set in the GitHub repository (or
  # organization) settings. Create a token at https://accounts.upbound.io.
  XPKG_ACCESS_ID: ${{ secrets.XPKG_ACCESS_ID }}

jobs:
  # Compute the package version once and share it with all jobs that need it.
  version:
    runs-on: &default-runner ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # If a version wasn't explicitly passed as a workflow_dispatch input we
      # default to v<function-version>-<git-commit-date>-<git-short-sha>, for
      # example v0.1.1-20231101115142-1091066df799. This is a simple
      # implementation of Go's pseudo-versions:
      # https://go.dev/ref/mod#pseudo-versions.
      - name: Compute Package Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            BASE="$(npm pkg get version --prefix functions/network | tr -d '"')"
            VERSION="v${BASE}-$(date -d@$(git show -s --format=%ct) +%Y%m%d%H%M%S)-$(git rev-parse --short=12 HEAD)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Computed version: ${VERSION}"

  # examples/network/providerconfig.yaml is tracked with placeholders and meant
  # to be edited locally, so real credentials are one `git add .` away from
  # being published. The pre-commit hook in .githooks/ catches that, but hooks
  # are opt-in per clone — this is the check that cannot be skipped.
  credentials:
    runs-on: *default-runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for AWS credentials
        run: hack/check-credentials.sh

  # TEMPORARY: build the crossplane CLI from source, because TypeScript
  # embedded functions are not in a released CLI yet. Building it once and
  # sharing the binary keeps the jobs below from each pulling the CLI's whole
  # dependency tree in parallel. See https://github.com/crossplane/cli/pull/170.
  cli:
    runs-on: *default-runner
    steps:
      - name: Checkout the Crossplane CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stevendborrelli/cli
          # Pinned to a commit rather than the branch: the branch is force-pushed
          # as the PR is revised, which would silently change what a release
          # builds. Bump this when picking up new CLI changes.
          ref: 0d19745dc682ca02085f59bc8d9dcf5c37538421

      # Take the Go version from the CLI's own go.mod so this keeps working as
      # the CLI moves forward.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # proxy.golang.org has returned transient stream errors on this download,
      # so retry before failing the whole workflow.
      - name: Download Go modules
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt ${attempt}), retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Build the Crossplane CLI
        run: go build -o crossplane ./cmd/crossplane

      - name: Upload the Crossplane CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crossplane-cli
          path: crossplane
          if-no-files-found: error
          retention-days: 1

  # Unit test the embedded TypeScript function. The generated crossplane-models
  # package is a file: dependency of the function, so the schemas have to exist
  # before npm can install.
  test:
    runs-on: *default-runner
    needs:
      - cli
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{env.NODE_VERSION}}

      - name: Setup the Crossplane CLI
        uses: ./.github/actions/crossplane-cli

      - name: Generate Schemas
        run: crossplane project build

      - name: Install
        run: npm install --prefix functions/network

      - name: Test
        run: npm test --prefix functions/network

      - name: Check Types
        run: npm run build --prefix functions/network

  # crossplane project build produces the multi-arch configuration package with
  # the embedded function image baked in, replacing the separate Dockerfile and
  # per-arch `xpkg build` invocations this repo used before.
  build:
    runs-on: *default-runner
    needs:
      - version
      - cli
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Setup the Crossplane CLI
        uses: ./.github/actions/crossplane-cli

      - name: Build the Project
        run: crossplane project build

      - name: Render the Example
        run: |
          crossplane composition render \
            examples/network/configuration-aws-network.yaml \
            apis/network/composition.yaml \
            --timeout=10m

      - name: Upload Package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: configuration-xpkg
          path: _output/*.xpkg
          if-no-files-found: error
          retention-days: 1

  # crossplane project push uploads the configuration package along with every
  # embedded function package it depends on.
  push:
    runs-on: *default-runner
    needs:
      - version
      - cli
      - test
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: configuration-xpkg
          path: _output

      - name: Setup the Crossplane CLI
        uses: ./.github/actions/crossplane-cli

      - name: Login to Upbound
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.XPKG_ACCESS_ID != ''
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.XPKG_ACCESS_ID }}
          password: ${{ secrets.XPKG_TOKEN }}

      - name: Push the Project
        if: env.XPKG_ACCESS_ID != ''
        run: crossplane project push --tag ${{needs.version.outputs.version}}
