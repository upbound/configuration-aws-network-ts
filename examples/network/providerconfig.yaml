# Passed to `crossplane project run --extra-resources=` so a dev cluster comes
# up already able to authenticate to AWS.
#
# Fill in the credentials below before running. Do NOT commit real ones — see
# the README's "Running a Local Dev Cluster" section for how to keep them out
# of git.
apiVersion: aws.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: network-team
spec:
  credentials:
    source: Secret
    secretRef:
      name: aws-creds
      namespace: network-team
      key: creds
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-creds
  namespace: network-team
type: Opaque
stringData:
  creds: |
    [default]
    aws_access_key_id=REPLACE_ME
    aws_secret_access_key=REPLACE_ME
    aws_session_token=REPLACE_ME
