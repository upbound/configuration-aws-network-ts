# Passed to `crossplane project run --extra-resources=` so a dev cluster comes
# up already able to authenticate to AWS.
#
# The ProviderConfig and the secret it references are kept together here so
# automated testing can apply both with one --extra-resources argument.
#
# Fill in the credentials below before running, but do NOT commit real ones.
# Keep your edit out of git first:
#
#   git update-index --skip-worktree examples/network/providerconfig.yaml
apiVersion: aws.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: network-team
spec:
  credentials:
    source: Secret
    secretRef:
      name: aws-creds
      namespace: network-team
      key: creds
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-creds
  namespace: network-team
type: Opaque
stringData:
  creds: |
    [default]
    aws_access_key_id=REPLACE_ME
    aws_secret_access_key=REPLACE_ME
    aws_session_token=REPLACE_ME
